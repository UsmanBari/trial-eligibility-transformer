# Single source of truth for paths, split and model settings.

dataset:
  hf_name: ncbi/TrialGPT-Criterion-Annotations
  hf_split: train            # the HF repo has only one split; we re-split by patient
  seed: 42
  n_train_patients: 37
  n_val_patients: 8
  n_test_patients: 8

paths:
  processed_dir: data/processed
  manifest: data/splits/split_manifest.json
  results_dir: results

model:
  # Final choice (see report, Section III-C). Candidate 2 is used only for the
  # zero-shot comparison.
  target: Qwen/Qwen2.5-1.5B-Instruct
  draft: Qwen/Qwen2.5-0.5B-Instruct
  candidates:
    - Qwen/Qwen2.5-1.5B-Instruct
    - HuggingFaceTB/SmolLM2-1.7B-Instruct
  max_input_tokens: 3072     # prompt budget; patient sentences dropped from the END if exceeded (logged)

finetune:
  method: lora
  output_dir: outputs/lora_qwen25_1p5b
  max_seq_len: 1024           # longest train example is 667 tokens, so nothing is cut
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  epochs: 3
  learning_rate: 2.0e-4
  per_device_batch_size: 1   # bs=4 ran out of memory on a 16 GB T4 (fp32 logits over a 152k vocab)
  grad_accum: 16              # effective batch still 16
  gradient_checkpointing: true
  warmup_ratio: 0.05
  lr_scheduler: cosine
  weight_decay: 0.0
  seed: 42
  logging_steps: 5

generation:
  do_sample: false           # deterministic greedy everywhere for evaluation
  max_new_tokens: 96
  batch_size: 8
